<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Generador de tests</title>
</head>

<body>
    <h1>Generador de tests</h1>
    <form action="generadorDeTests.php" method="POST">
        <label for="asignatura">Asignatura:</label>
        <select id="asignatura" name="asignatura" required>
            <option value="matematicas">Matemáticas</option>
            <option value="historia">Historia</option>
            <option value="ciencias">Ciencias</option>
        </select>
        <br><br>
        <label for="numeroDePreguntas">Número de preguntas:</label>
        <input type="number" id="numeroDePreguntas" name="numeroDePreguntas" min="1" max="5" step="1" required>
        <br><button type="submit">Generar test</button>
    </form>
</body>

</html>
