<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="font-manrope">
    <header class="flex justify-around h-20 items-center border  border-gray-200">

        <a class="w-30" href="">
            <img src="assets-png/logo-modo-claro.png" alt="">
        </a>

        <nav class="space-x-5">
            <a href="">Funciones</a>
            <a href="">Precios</a>
            <a href="">Empezar</a>
            <a class="bg-purple-600 text-white p-3 rounded-3xl" href="">Prueba gratis</a>
        </nav>

        <button id="modoOscuro" class="inline-flex p-2 border border-gray-300 rounded-full" href="">
            <img class="w-5 cursor-pointer" src="assets-png/icono-luna.png" alt="">
            <img class="w-5 hidden" src="assets-png/icono-sol.png" alt="">
        </button>
    </header>

    <main>
        <section class="flex gap-15 py-30 bg-linear-to-b from-indigo-100 to-white justify-center  dark:from-slate-800 dark:to-slate-950">
            <div class="w-[35%]">
                <h1 class="text-6xl font-bold">Tu equipo, por fin en la misma página</h1>
                <p class="text-gray-600 text-lg mt-2 mb-8 w-110">Nimbo reúne tareas, fechas y responsables en tableros
                    claros. Menos reuniones, más trabajo hecho.</p>
                <a class="bg-purple-600 text-white px-4 py-3 rounded-xl mr-4 text-[15px]" href="">Empieza gratis</a>
                <a class="border border-gray-400 px-4 py-3 rounded-xl font-medium text-[15px]" href="">Ver funciones</a>
                <span class="block mt-5 text-[12px] text-gray-500">Sin trajeta de crédito. Cancela cuando
                    quieras.</span>
            </div>

            <img class="w-[40%] rounded-xl border text-gray-200" src="assets-png/hero-modo-claro.png" alt="">
        </section>

    </main>

    <script>
        const boton = document.querySelector("#modoOscuro");

        boton.addEventListener("click", () => {
            document.documentElement.classList.toggle("dark");
        });
    </script>
</body>

</html>
