<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            transition: all 1s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: wrap;
        }

        div {
            width: 200px;
            height: 200px;
            background-color: salmon;
            border: solid 10px white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            font-size: 5rem;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px black;
        }

        #c1 {
            background: url("https://picsum.photos/400") center center no-repeat;
        }

        #c1:hover {
            background-position: 50% 0%;
        }

        span {
            opacity: 0;
        }

        span:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div id="c1"><span>+</span></div>
    <div id="c2"></div>
    <div id="c3"></div>
    <div id="c4"></div>
    <div id="c5"></div>
    <div id="c6"></div>
    <div id="c7"></div>
    <div id="c8"></div>
    <div id="c9"></div>
</body>

</html>
